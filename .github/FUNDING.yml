# FUNDING.yml
# This file allows you to define financial support options for your project.
# It links contributors to platforms where they can sponsor or donate.
# You can use GitHub Sponsors or other external funding platforms.

# Enable GitHub Sponsors for this repository
# Replace 'your-username' with your GitHub username.
github: 
  - AhmedOsamaMath
  # You can list multiple GitHub accounts if applicable:
  # - another-username

# Add Patreon as a funding option
# Replace 'your-username' with your Patreon username.
patreon: AhmedOsamaMath

# Add Open Collective as a funding option
# Replace 'your-collective' with the name of your Open Collective group.
opencollective: your-collective

# Add Ko-fi as a funding option
# Replace 'your-username' with your Ko-fi username.
kofi: your-username

# Add Liberapay as a funding option
# Replace 'your-username' with your Liberapay username.
liberapay: your-username

# Add Buy Me a Coffee as a funding option
# Replace 'your-username' with your Buy Me a Coffee username.
buymeacoffee: your-username

# Add custom donation links
# Replace 'https://your-donation-page.com' with the URL to your custom donation page.
custom: 
  - "https://your-donation-page.com"
  # You can add multiple custom URLs:
  # - "https://another-donation-link.com"
